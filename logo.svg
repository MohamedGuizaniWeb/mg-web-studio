<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 132" role="img" aria-labelledby="title desc">
  <title id="title">MG Web Studio mark</title>
  <desc id="desc">Centered MG monogram inside a rounded browser window.</desc>
  <defs>
    <linearGradient id="accent" x1="8" y1="8" x2="124" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#4fd1c5"/>
    </linearGradient>
  </defs>

  <rect x="5" y="5" width="122" height="122" rx="27" fill="#0b1729" stroke="url(#accent)" stroke-width="6"/>
  <path d="M8 35H124" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="24" cy="20" r="4" fill="#4fd1c5"/>
  <circle cx="39" cy="20" r="4" fill="#7c5cff"/>
  <path d="M106 34L119 15" fill="none" stroke="#4fd1c5" stroke-width="7" stroke-linecap="round"/>

  <!-- The monogram is optically centered in the usable browser area. -->
  <text x="66" y="105" text-anchor="middle" fill="#f8fbff"
        font-family="Inter, Arial Black, Arial, sans-serif" font-size="68" font-weight="900"
        letter-spacing="-8">MG</text>
</svg>
